name: Update Chelsea Calendar

on:
  push:
    branches:
      - fix/wait-for-pages-artifact
  workflow_dispatch:

  schedule:
    - cron: "20 * * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate ICS
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python main.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      # The artifact API can briefly return an empty result immediately after upload.
      - name: Wait for Pages artifact availability
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import time

          import requests

          url = (
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts"
          )
          headers = {
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          for attempt in range(1, 13):
              response = requests.get(
                  url, params={"name": "github-pages"}, headers=headers, timeout=15
              )
              response.raise_for_status()
              artifacts = response.json().get("artifacts", [])
              visible = any(
                  artifact.get("name") == "github-pages" and not artifact.get("expired")
                  for artifact in artifacts
              )
              if visible:
                  print(f"Pages artifact is visible (attempt {attempt}/12).")
                  break
              if attempt == 12:
                  raise RuntimeError("Pages artifact was not visible after 12 checks.")
              print(f"Pages artifact is not visible (attempt {attempt}/12); retrying in 5s.")
              time.sleep(5)
          PY
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4